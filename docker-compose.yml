version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: opspilot-postgres
    restart: always
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot_pass
      POSTGRES_DB: opspilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: opspilot-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opspilot-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://opspilot:opspilot_pass@postgres:5432/opspilot
      - DATABASE_URL_SYNC=postgresql://opspilot:opspilot_pass@postgres:5432/opspilot
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=opspilot-production-secret-key-change-me-12345
      - DEFAULT_LLM_PROVIDER=mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opspilot-worker
    restart: always
    command: celery -A worker.celery_app worker --loglevel=info
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://opspilot:opspilot_pass@postgres:5432/opspilot
      - DATABASE_URL_SYNC=postgresql://opspilot:opspilot_pass@postgres:5432/opspilot
      - REDIS_URL=redis://redis:6379/0
      - DEFAULT_LLM_PROVIDER=mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opspilot-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: opspilot-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: opspilot-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
